<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Línea de Tiempo Interactiva</title>
    <!-- D3.js v7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Font Awesome 6 (gratuito) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- RESET Y BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 1.8rem 1.5rem 0.5rem 1.5rem;
            transition: all 0.2s;
        }
        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }
        /* ---------- CONTENEDOR DEL GRÁFICO ---------- */
        .chart-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #e9edf2;
        }
        .chart-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            cursor: grab;
            padding-bottom: 4px;
        }
        .chart-scroll:active {
            cursor: grabbing;
        }
        svg {
            display: block;
            background: #ffffff;
            font-family: inherit;
        }
        /* ---------- EJES Y ETIQUETAS ---------- */
        .axis path,
        .axis line {
            stroke: #cbd5e1;
            stroke-width: 1.5;
            shape-rendering: crispEdges;
        }
        .axis .tick line {
            stroke: #e2e8f0;
            stroke-width: 0.5;
        }
        .axis .tick text {
            fill: #334155;
            font-size: 11px;
            font-weight: 500;
        }
        .label-localidad {
            font-weight: 600;
            font-size: 13px;
            fill: #0f172a;
            dominant-baseline: middle;
            text-anchor: end;
            letter-spacing: 0.2px;
        }
        /* ---------- BARRAS DE FONDO (filas) ---------- */
        .row-bg {
            fill: #fafcfd;
        }
        .row-bg:nth-child(odd) {
            fill: #f1f5f9;
        }
        /* ---------- EVENTOS (puntos y barras) ---------- */
        .event-point,
        .event-bar {
            cursor: pointer;
            transition: filter 0.15s;
        }
        .event-point:hover,
        .event-bar:hover {
            filter: brightness(0.9) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
        }
        .event-point circle {
            stroke: #ffffff;
            stroke-width: 2px;
        }
        .event-bar rect {
            stroke: #ffffff;
            stroke-width: 1px;
            rx: 4px;
            ry: 4px;
        }
        /* íconos dentro de barras/puntos */
        .event-icon {
            pointer-events: none;
            fill: #ffffff;
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        /* ---------- TOOLTIP (popup) ---------- */
        .tooltip {
            position: fixed;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.08);
            padding: 1.25rem 1.5rem 1.25rem 1.5rem;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.15s ease;
            transform: translateY(4px);
            z-index: 1000;
            border: 1px solid #f0f2f5;
            backdrop-filter: blur(2px);
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1e293b;
        }
        .tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .tooltip .tt-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            font-weight: 600;
            font-size: 1rem;
            color: #0f172a;
        }
        .tooltip .tt-header i {
            font-size: 1.1rem;
            width: 1.6rem;
            text-align: center;
        }
        .tooltip .tt-text {
            margin-bottom: 0.7rem;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .tooltip .tt-text .full-text {
            display: none;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #d1d9e6;
            font-weight: 400;
            color: #334155;
        }
        .tooltip .tt-text .full-text.show {
            display: block;
        }
        .tooltip .tt-footer {
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #ecf1f7;
            padding-top: 0.5rem;
            margin-top: 0.3rem;
        }
        .tooltip .btn-more {
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            padding: 0.2rem 0.5rem 0.2rem 0;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .tooltip .btn-more:hover {
            background: #eff6ff;
        }
        .tooltip .btn-more i {
            font-size: 0.7rem;
        }
        /* ---------- LEYENDA ---------- */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.5rem;
            padding: 0.8rem 0 0.2rem 0;
            border-top: 1px solid #e9edf2;
            margin-top: 1rem;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            padding: 0.2rem 0.8rem 0.2rem 0.5rem;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
        }
        .legend-item i {
            font-size: 0.9rem;
            width: 1.2rem;
            text-align: center;
        }
        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .container {
                padding: 0.8rem 0.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .legend {
                gap: 0.3rem 0.8rem;
            }
            .legend-item {
                font-size: 0.7rem;
                padding: 0.1rem 0.5rem;
            }
            .tooltip {
                max-width: 280px;
                padding: 1rem;
            }
        }
        /* ---------- OCULTAR ELEMENTOS VACIOS ---------- */
        .hidden {
            display: none !important;
        }
        /* spinner de carga */
        .loader {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        .loader i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fas fa-timeline" style="color:#3b82f6;"></i>
            Línea de Tiempo Histórica
        </h1>
        <div class="subtitle">
            <i class="fas fa-map-pin" style="color:#3b82f6; margin-right:6px;"></i>
            Eventos por localidad · Pasa el mouse para previsualizar · Haz clic en <strong>“Ver más”</strong> para leer el texto completo
        </div>

        <!-- Contenedor del gráfico -->
        <div class="chart-wrapper">
            <div id="chart-scroll" class="chart-scroll">
                <div id="loader" class="loader">
                    <i class="fas fa-spinner fa-pulse"></i>
                    Cargando datos...
                </div>
                <svg id="timeline-svg" style="display:none;"></svg>
            </div>
        </div>

        <!-- Leyenda (se llena con JS) -->
        <div id="legend-container" class="legend"></div>
    </div>

    <!-- Tooltip flotante -->
    <div id="tooltip" class="tooltip">
        <div class="tt-header">
            <i id="tt-icon" class="fas fa-circle"></i>
            <span id="tt-localidad"></span>
        </div>
        <div class="tt-text">
            <div id="tt-short"></div>
            <div id="tt-full" class="full-text"></div>
            <button id="tt-btn-more" class="btn-more">
                <i class="fas fa-chevron-down"></i> Ver más
            </button>
        </div>
        <div class="tt-footer" id="tt-footer"></div>
    </div>

    <script>
        // --------------------------------------------------------------
        // 1. CONFIGURACIÓN
        // --------------------------------------------------------------
        const CATEGORIAS = {
            'Huellas del transporte y las comunicaciones': {
                icono: 'fa-train',
                color: '#0ea5e9' // azul
            },
            'Huellas de la energía': {
                icono: 'fa-bolt',
                color: '#f59e0b' // amarillo
            },
            'Huellas de la infraestructura y las  instituciones': {
                icono: 'fa-building',
                color: '#8b5cf6' // violeta
            },
            'Huellas del trabajo': {
                icono: 'fa-industry',
                color: '#ef4444' // rojo
            },
            'Huellas de la identidad y la celebración': {
                icono: 'fa-star',
                color: '#ec4899' // rosa
            }
        };

        // Paleta de colores para localidades (hasta 30, se repite si hay más)
        const PALETA_LOCALIDAD = [
            '#1e293b', '#0f766e', '#b91c1c', '#7c3aed', '#b45309',
            '#15803d', '#be185d', '#1d4ed8', '#9a3412', '#065f46',
            '#86198f', '#0e7490', '#92400e', '#4c1d95', '#166534',
            '#991b1b', '#155e75', '#78350f', '#1e3a8a', '#831843',
            '#365314', '#701a75', '#14532d', '#881337', '#1c1917'
        ];

        // --------------------------------------------------------------
        // 2. FUNCIONES AUXILIARES
        // --------------------------------------------------------------
        function extraerAnios(str) {
            if (!str) return null;
            // Busca números de 4 dígitos (rango o único)
            const nums = str.match(/\b\d{4}\b/g);
            if (!nums || nums.length === 0) return null;
            const anios = nums.map(Number);
            if (anios.length === 1) {
                return { inicio: anios[0], fin: anios[0], esRango: false };
            } else {
                // Tomar el primero y el último (puede haber más si hay texto)
                let inicio = Math.min(...anios);
                let fin = Math.max(...anios);
                // Si inicio > fin, invertir (por si hay error de tipeo)
                if (inicio > fin)[inicio, fin] = [fin, inicio];
                return { inicio, fin, esRango: (inicio !== fin) };
            }
        }

        function primeraOracion(texto) {
            if (!texto) return '';
            const partes = texto.split(/(?<=[.!?])\s+/);
            return partes.length > 0 ? partes[0] : texto;
        }

        function obtenerIconoCategoria(cat) {
            const def = CATEGORIAS[cat];
            return def ? def.icono : 'fa-question-circle';
        }

        function obtenerColorCategoria(cat) {
            const def = CATEGORIAS[cat];
            return def ? def.color : '#94a3b8';
        }

        function obtenerColorLocalidad(localidad, index) {
            return PALETA_LOCALIDAD[index % PALETA_LOCALIDAD.length];
        }

        // --------------------------------------------------------------
        // 3. CARGA DE DATOS
        // --------------------------------------------------------------
        const archivoCSV = 'CRONOLOGIAS_FINAL.csv';

        d3.csv(archivoCSV, {
            delimiter: ';',
            row: d => {
                // Limpiar campos
                const añoRaw = d.Año ? d.Año.trim() : '';
                const localidad = d.Localidad ? d.Localidad.trim() : 'Sin localidad';
                const desc = d.Descripción ? d.Descripción.trim() : '';
                const categoria = d.Categoría ? d.Categoría.trim() : 'Sin categoría';
                const fuente = d.Fuente ? d.Fuente.trim() : '';
                const pag = d.Pag ? d.Pag.trim() : '';

                return { añoRaw, localidad, desc, categoria, fuente, pag };
            }
        }).then(data => {
            // Filtrar filas vacías
            const filtrados = data.filter(d => d.añoRaw !== '' && d.desc !== '');

            if (filtrados.length === 0) {
                document.getElementById('loader').innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i> No se encontraron datos válidos.';
                return;
            }

            // Procesar años y construir eventos
            const eventos = [];
            filtrados.forEach(d => {
                const anios = extraerAnios(d.añoRaw);
                if (!anios) return;
                eventos.push({
                    inicio: anios.inicio,
                    fin: anios.fin,
                    esRango: anios.esRango,
                    localidad: d.localidad,
                    desc: d.desc,
                    categoria: d.categoria,
                    fuente: d.fuente,
                    pag: d.pag
                });
            });

            if (eventos.length === 0) {
                document.getElementById('loader').innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i> No se pudo interpretar ningún año.';
                return;
            }

            // Ocultar loader y mostrar SVG
            document.getElementById('loader').style.display = 'none';
            const svg = d3.select('#timeline-svg');
            svg.style('display', 'block');

            // --------------------------------------------------------------
            // 4. DIMENSIONES Y ESCALAS
            // --------------------------------------------------------------
            const margin = { top: 40, right: 60, bottom: 60, left: 160 };
            const rowHeight = 56;
            const localidadesUnicas = [...new Set(eventos.map(e => e.localidad))];
            const numFilas = localidadesUnicas.length;
            const innerHeight = numFilas * rowHeight;
            const height = margin.top + innerHeight + margin.bottom;

            // Ancho inicial (se ajustará con zoom)
            let anchoInicial = 1600; // se puede cambiar dinámicamente
            const minYear = d3.min(eventos, d => d.inicio) - 2;
            const maxYear = d3.max(eventos, d => d.fin) + 2;
            const rangoAnios = maxYear - minYear;

            // Escala x original (lineal)
            const xScale = d3.scaleLinear()
                .domain([minYear, maxYear])
                .range([0, anchoInicial]);

            // Escala y (banda para localidades)
            const yScale = d3.scaleBand()
                .domain(localidadesUnicas)
                .range([margin.top, height - margin.bottom])
                .padding(0.3);

            // Asignar colores a localidades
            const colorLocalidad = d3.scaleOrdinal()
                .domain(localidadesUnicas)
                .range(localidadesUnicas.map((_, i) => obtenerColorLocalidad(_, i)));

            // --------------------------------------------------------------
            // 5. CREAR SVG Y GRUPOS
            // --------------------------------------------------------------
            svg.attr('width', anchoInicial + margin.left + margin.right)
                .attr('height', height);

            const container = svg.append('g')
                .attr('transform', `translate(${margin.left},0)`);

            // Fondo de filas (alternado)
            container.selectAll('.row-bg')
                .data(localidadesUnicas)
                .enter()
                .append('rect')
                .attr('class', 'row-bg')
                .attr('x', 0)
                .attr('y', d => yScale(d))
                .attr('width', anchoInicial)
                .attr('height', yScale.bandwidth())
                .attr('fill', (d, i) => i % 2 === 0 ? '#fafcfd' : '#f1f5f9');

            // Etiquetas de localidades (fijas en y)
            container.selectAll('.label-localidad')
                .data(localidadesUnicas)
                .enter()
                .append('text')
                .attr('class', 'label-localidad')
                .attr('x', -10)
                .attr('y', d => yScale(d) + yScale.bandwidth() / 2)
                .text(d => d)
                .style('fill', d => colorLocalidad(d));

            // Eje X (se actualizará en zoom)
            const axisGroup = container.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(0, ${height - margin.bottom})`);

            const axisX = d3.axisBottom(xScale)
                .tickValues(d3.range(Math.floor(minYear / 10) * 10, maxYear + 10, 10))
                .tickFormat(d3.format('d'));

            axisGroup.call(axisX);

            // Grupo para los eventos
            const eventsGroup = container.append('g')
                .attr('class', 'events-group');

            // --------------------------------------------------------------
            // 6. DIBUJAR EVENTOS (puntos y barras)
            // --------------------------------------------------------------
            function drawEvents(scaleX) {
                // Limpiar eventos previos
                eventsGroup.selectAll('.event-point, .event-bar').remove();

                // Filtramos eventos según el rango visible (opcional)
                // Dibujamos todos, pero el scroll/zoom los mostrará

                // Agrupamos por localidad para ordenar
                const eventosPorLocalidad = d3.groups(eventos, d => d.localidad);

                eventosPorLocalidad.forEach(([localidad, eventosLoc]) => {
                    const yPos = yScale(localidad) + yScale.bandwidth() / 2;
                    const colorCat = d => obtenerColorCategoria(d.categoria);
                    const iconoCat = d => obtenerIconoCategoria(d.categoria);

                    eventosLoc.forEach(ev => {
                        const x1 = scaleX(ev.inicio);
                        const x2 = scaleX(ev.fin);
                        const w = Math.max(x2 - x1, 2); // mínimo ancho para barras
                        const cat = ev.categoria;
                        const color = colorCat(ev);
                        const icon = iconoCat(ev);

                        if (ev.esRango) {
                            // Barra
                            const barGroup = eventsGroup.append('g')
                                .attr('class', 'event-bar')
                                .attr('transform', `translate(${x1}, ${yPos - 12})`)
                                .datum(ev);

                            barGroup.append('rect')
                                .attr('width', w)
                                .attr('height', 24)
                                .attr('rx', 4)
                                .attr('ry', 4)
                                .attr('fill', color)
                                .attr('stroke', 'white')
                                .attr('stroke-width', 1);

                            // Ícono en el centro de la barra
                            barGroup.append('text')
                                .attr('class', 'event-icon')
                                .attr('x', w / 2)
                                .attr('y', 12)
                                .html(`<i class="fas ${icon}" style="color:white; font-size:13px;"></i>`);

                            // Eventos mouse
                            barGroup.on('mouseenter', function(event) {
                                    const evData = d3.select(this).datum();
                                    showTooltip(event, evData);
                                })
                                .on('mouseleave', function() {
                                    hideTooltip();
                                })
                                .on('mousemove', function(event) {
                                    moveTooltip(event);
                                });

                        } else {
                            // Punto
                            const pointGroup = eventsGroup.append('g')
                                .attr('class', 'event-point')
                                .attr('transform', `translate(${x1}, ${yPos})`)
                                .datum(ev);

                            pointGroup.append('circle')
                                .attr('r', 10)
                                .attr('fill', color)
                                .attr('stroke', 'white')
                                .attr('stroke-width', 2);

                            pointGroup.append('text')
                                .attr('class', 'event-icon')
                                .attr('x', 0)
                                .attr('y', 0)
                                .html(`<i class="fas ${icon}" style="color:white; font-size:12px;"></i>`);

                            pointGroup.on('mouseenter', function(event) {
                                    const evData = d3.select(this).datum();
                                    showTooltip(event, evData);
                                })
                                .on('mouseleave', function() {
                                    hideTooltip();
                                })
                                .on('mousemove', function(event) {
                                    moveTooltip(event);
                                });
                        }
                    });
                });
            }

            // Dibujar inicial
            drawEvents(xScale);

            // --------------------------------------------------------------
            // 7. ZOOM Y PANNING (SOLO HORIZONTAL)
            // --------------------------------------------------------------
            const zoom = d3.zoom()
                .extent([
                    [0, 0],
                    [anchoInicial, height]
                ])
                .scaleExtent([0.3, 8])
                .on('zoom', function(event) {
                    const transform = event.transform;
                    // Nueva escala x
                    const x2 = transform.rescaleX(xScale);
                    // Actualizar eje x
                    axisGroup.call(d3.axisBottom(x2)
                        .tickValues(d3.range(Math.floor(minYear / 10) * 10, maxYear + 10, 10))
                        .tickFormat(d3.format('d'))
                    );
                    // Redibujar eventos con la nueva escala
                    drawEvents(x2);
                    // Ajustar ancho del SVG? No es necesario, se expande con el scroll.
                });

            // Aplicar zoom al SVG (captura eventos de rueda y arrastre)
            svg.call(zoom);

            // --------------------------------------------------------------
            // 8. TOOLTIP (POPUP)
            // --------------------------------------------------------------
            const tooltip = d3.select('#tooltip');
            const ttShort = document.getElementById('tt-short');
            const ttFull = document.getElementById('tt-full');
            const ttLocalidad = document.getElementById('tt-localidad');
            const ttIcon = document.getElementById('tt-icon');
            const ttFooter = document.getElementById('tt-footer');
            const btnMore = document.getElementById('tt-btn-more');

            let currentEventData = null;
            let expanded = false;

            function showTooltip(event, ev) {
                currentEventData = ev;
                const icon = obtenerIconoCategoria(ev.categoria);
                const color = obtenerColorCategoria(ev.categoria);
                ttIcon.className = `fas ${icon}`;
                ttIcon.style.color = color;
                ttLocalidad.textContent = ev.localidad;

                const short = primeraOracion(ev.desc);
                ttShort.textContent = short;
                ttFull.textContent = ev.desc;
                ttFull.classList.remove('show');
                const footerText = `${ev.fuente} ${ev.pag ? '· Pág. ' + ev.pag : ''}`;
                ttFooter.textContent = footerText;

                // Botón "Ver más": resetear estado
                expanded = false;
                btnMore.innerHTML = '<i class="fas fa-chevron-down"></i> Ver más';

                const rect = event.currentTarget.getBoundingClientRect();
                const tooltipNode = tooltip.node();
                tooltipNode.style.left = (event.clientX + 14) + 'px';
                tooltipNode.style.top = (event.clientY - 10) + 'px';
                tooltip.classed('visible', true);
            }

            function moveTooltip(event) {
                const tooltipNode = tooltip.node();
                tooltipNode.style.left = (event.clientX + 14) + 'px';
                tooltipNode.style.top = (event.clientY - 10) + 'px';
            }

            function hideTooltip() {
                tooltip.classed('visible', false);
                // Si está expandido, al cerrar no importa
            }

            // Botón "Ver más"
            btnMore.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!currentEventData) return;
                expanded = !expanded;
                if (expanded) {
                    ttFull.classList.add('show');
                    btnMore.innerHTML = '<i class="fas fa-chevron-up"></i> Ver menos';
                } else {
                    ttFull.classList.remove('show');
                    btnMore.innerHTML = '<i class="fas fa-chevron-down"></i> Ver más';
                }
                // Ajustar posición del tooltip para que no se salga de la pantalla
                const tooltipNode = tooltip.node();
                const rect = tooltipNode.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    tooltipNode.style.left = (window.innerWidth - rect.width - 20) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    tooltipNode.style.top = (window.innerHeight - rect.height - 20) + 'px';
                }
            });

            // Ocultar al hacer clic fuera
            document.addEventListener('click', function(e) {
                if (!tooltip.node().contains(e.target)) {
                    hideTooltip();
                }
            });

            // También ocultar al presionar Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') hideTooltip();
            });

            // --------------------------------------------------------------
            // 9. LEYENDA DE CATEGORÍAS
            // --------------------------------------------------------------
            const legendDiv = document.getElementById('legend-container');
            const categoriasSet = new Set(eventos.map(e => e.categoria));
            categoriasSet.forEach(cat => {
                const icon = obtenerIconoCategoria(cat);
                const color = obtenerColorCategoria(cat);
                const item = document.createElement('span');
                item.className = 'legend-item';
                item.innerHTML = `<i class="fas ${icon}" style="color:${color};"></i> ${cat}`;
                legendDiv.appendChild(item);
            });

            // --------------------------------------------------------------
            // 10. AJUSTE DE ANCHO DINÁMICO (scroll horizontal)
            // --------------------------------------------------------------
            function actualizarAncho() {
                const wrapper = document.getElementById('chart-scroll');
                const anchoMostrado = wrapper.clientWidth;
                // El ancho del SVG debe ser al menos el ancho mostrado, pero si el zoom permite más, será mayor.
                // Podemos aumentar el ancho del SVG si es necesario.
                const anchoSVG = Math.max(anchoMostrado, anchoInicial + margin.left + margin.right);
                svg.attr('width', anchoSVG);
            }

            // Inicializar y ajustar en resize
            actualizarAncho();
            window.addEventListener('resize', actualizarAncho);

            // --------------------------------------------------------------
            // 11. FIN
            // --------------------------------------------------------------
            console.log(`✅ Cargados ${eventos.length} eventos.`);
        }).catch(error => {
            console.error('Error al cargar el CSV:', error);
            document.getElementById('loader').innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                Error al cargar los datos. Asegúrate de que el archivo <strong>CRONOLOGIAS_FINAL.csv</strong> esté en la misma carpeta.
                <br><small>${error.message}</small>
            `;
        });
    </script>
</body>
</html>
